<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Матеріали виходів KUSUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky header with audience switch; doctors = month → week rows × 4 specialty columns; pharmacists = month → item list */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#1d2523; --muted:#5f6b67; --line:#dde2df;
  --accent:#0f6b5c; --accent-soft:#e2f0ec; --warn:#a15c00; --warn-soft:#fbf0dc;
  --sp1:#2f6db3; --sp2:#2f8a57; --sp3:#7a4fb0; --sp4:#c0446a;
  --f-display:"Manrope",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --ink:#e7ecea; --muted:#9aa7a2; --line:#2c3633;
  --accent:#5fc4ad; --accent-soft:#1d3530; --warn:#e7a54a; --warn-soft:#3a2c16;
  --sp1:#7fb0ea; --sp2:#74c995; --sp3:#b896e6; --sp4:#ec8aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --ink:#e7ecea; --muted:#9aa7a2; --line:#2c3633;
  --accent:#5fc4ad; --accent-soft:#1d3530; --warn:#e7a54a; --warn-soft:#3a2c16;
  --sp1:#7fb0ea; --sp2:#74c995; --sp3:#b896e6; --sp4:#ec8aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.seg a{font-family:var(--f-display);font-weight:700;text-decoration:none;color:var(--muted);padding:8px 18px;border-radius:999px;font-size:.95rem}
.seg a[aria-current="page"]{background:var(--accent);color:var(--surface)}
.seg a:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .88rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
select,input[type=search]{font:500 .9rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input[type=search]{flex:1 1 220px;max-width:340px}
.count{color:var(--muted);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
.month{margin-block:8px 28px}
.month h2{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.month h2 span{font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--muted)}
/* doctors grid */
.week{display:grid;grid-template-columns:118px repeat(var(--cols),minmax(0,1fr));gap:8px;margin-bottom:8px}
.wk{padding:10px 4px;font-size:.82rem;color:var(--muted)}
.wk b{display:block;font-family:var(--f-display);font-size:.98rem;color:var(--ink);font-variant-numeric:tabular-nums}
.cell{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell .sp{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.brand{font-family:var(--f-display);font-weight:700;font-size:.98rem}
.theme{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.open{font:600 .84rem var(--f-body);color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:5px 10px;white-space:nowrap}
.open:hover{background:var(--accent-soft)}
.st{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--warn-soft);color:var(--warn)}
.colhead{display:grid;grid-template-columns:118px repeat(var(--cols),minmax(0,1fr));gap:8px;margin-bottom:8px}
.colhead div{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px}
/* pharmacists list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.note{color:var(--muted);font-size:.82rem;padding-block:6px 30px}
@media (max-width:820px){
  .colhead{display:none}
  .week{grid-template-columns:1fr}
  .wk{padding:4px 0 0}
  .wk b{display:inline;margin-right:6px}
  .seg{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.open,.chip{transition:background .15s}}
</style>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}</style>

const MONTHS=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
const mkey=m=>{const [n,y]=m.toLowerCase().split(/\s+/);return (+y)*100+MONTHS.indexOf(n)};
const dkey=d=>{const p=(d||'').split('.');return p.length===3?+(p[2]+p[1]+p[0]):0};
const SPECS=[['Сімейні лікарі','--sp1'],['Гастроентерологи','--sp2'],['Неврологи/психіатри','--sp3'],['Гінекологи','--sp4']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=s=>s==='review'?'<span class="st">На затвердженні</span>':'';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---- doctors ---- */
let specOn=new Set(store.get('specOn',SPECS.map(s=>s[0])));
const drMonths=[...new Set(DATA.dr.map(x=>x.m))].sort((a,b)=>mkey(b)-mkey(a));
const drSel=document.getElementById('dr-month');
drSel.innerHTML='<option value="">Усі місяці</option>'+drMonths.map(m=>`<option>${esc(m)}</option>`).join('');
const chipsEl=document.getElementById('spec-chips');
function drawChips(){
  chipsEl.innerHTML=SPECS.map(([n,c])=>`<button class="chip" type="button" aria-pressed="${specOn.has(n)}" data-s="${esc(n)}"><span class="dot" style="background:var(${c})"></span>${esc(n)}</button>`).join('');
}
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const s=b.dataset.s;
  if(specOn.has(s)){if(specOn.size>1)specOn.delete(s)}else specOn.add(s);store.set('specOn',[...specOn]);drawChips();renderDr()});
function renderDr(){
  const q=document.getElementById('dr-q').value.trim().toLowerCase(), m=drSel.value;
  const specs=SPECS.filter(s=>specOn.has(s[0]));
  const rows=DATA.dr.filter(x=>specOn.has(x.sp)&&(!m||x.m===m)&&(!q||(x.b+' '+x.th).toLowerCase().includes(q)));
  document.getElementById('dr-count').textContent=`${rows.length} виходів`;
  if(!rows.length){document.getElementById('dr-out').innerHTML='<p class="empty">Нічого не знайдено. Змініть фільтри або пошук.</p>';return}
  const byM={};rows.forEach(x=>{(byM[x.m]??={})[x.d]??=[];byM[x.m][x.d].push(x)});
  const cols=specs.length;
  let h='';
  Object.keys(byM).sort((a,b)=>mkey(b)-mkey(a)).forEach(mm=>{
    const n=Object.values(byM[mm]).flat().length;
    h+=`<section class="month"><h2>${esc(mm)}<span>${n} виходів</span></h2>`;
    h+=`<div class="colhead" style="--cols:${cols}"><div>Дата</div>${specs.map(([s,c])=>`<div><span class="dot" style="background:var(${c})"></span>${esc(s)}</div>`).join('')}</div>`;
    Object.keys(byM[mm]).sort((a,b)=>dkey(a)-dkey(b)).forEach(d=>{
      const items=byM[mm][d];
      h+=`<div class="week" style="--cols:${cols}"><div class="wk"><b>${esc(d)}</b>${esc(items[0].t)}</div>`;
      specs.forEach(([s,c])=>{const x=items.find(i=>i.sp===s);
        h+= x?`<article class="cell" style="--c:var(${c})"><span class="sp">${esc(s)}</span><span class="brand">${esc(x.b)}</span><span class="theme">${esc(x.th)}</span><div class="foot">${st(x.s)}<a class="open" href="${esc(x.u)}" target="_blank" rel="noopener">Відкрити ↗</a></div></article>`:'<div></div>'});
      h+='</div>';
    });
    h+='</section>';
  });
  document.getElementById('dr-out').innerHTML=h;
}
drSel.addEventListener('change',renderDr);document.getElementById('dr-q').addEventListener('input',renderDr);

/* ---- pharmacists ---- */
const years=[...new Set(DATA.ph.map(x=>x.m.split(/\s+/).pop()))].sort().reverse();
let yearOn=store.get('yearOn','all');
const yc=document.getElementById('year-chips');
function drawYears(){yc.innerHTML=[['all','Усі роки'],...years.map(y=>[y,y])].map(([v,l])=>`<button class="chip" type="button" aria-pressed="${yearOn===v}" data-y="${v}">${l}</button>`).join('')}
yc.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;yearOn=b.dataset.y;store.set('yearOn',yearOn);drawYears();fillPhMonths();renderPh()});
const phSel=document.getElementById('ph-month');
function fillPhMonths(){const ms=[...new Set(DATA.ph.filter(x=>yearOn==='all'||x.m.endsWith(yearOn)).map(x=>x.m))].sort((a,b)=>mkey(b)-mkey(a));
  phSel.innerHTML='<option value="">Усі місяці</option>'+ms.map(m=>`<option>${esc(m)}</option>`).join('')}
function renderPh(){
  const q=document.getElementById('ph-q').value.trim().toLowerCase(), m=phSel.value;
  const rows=DATA.ph.filter(x=>(yearOn==='all'||x.m.endsWith(yearOn))&&(!m||x.m===m)&&(!q||(x.b+' '+x.th).toLowerCase().includes(q)));
  document.getElementById('ph-count').textContent=`${rows.length} виходів`;
  if(!rows.length){document.getElementById('ph-out').innerHTML='<p class="empty">Нічого не знайдено. Змініть фільтри або пошук.</p>';return}
  const byM={};rows.forEach(x=>(byM[x.m]??=[]).push(x));
  let h='';
  Object.keys(byM).sort((a,b)=>mkey(b)-mkey(a)).forEach(mm=>{
    h+=`<section class="month"><h2>${esc(mm)}<span>${byM[mm].length} виходів</span></h2><div class="list">`;
    byM[mm].sort((a,b)=>dkey(a.d)-dkey(b.d)).forEach(x=>{
      h+=`<article class="item"><div class="meta"><b>${esc(x.d)}</b><span>${esc(x.t)}</span></div><span class="brand">${esc(x.b)}</span><span class="theme">${esc(x.th)}</span><div class="foot">${st(x.s)}<a class="open" href="${esc(x.u)}" target="_blank" rel="noopener">Відкрити ↗</a></div></article>`});
    h+='</div></section>';
  });
  document.getElementById('ph-out').innerHTML=h;
}
phSel.addEventListener('change',renderPh);document.getElementById('ph-q').addEventListener('input',renderPh);

/* ---- routing ---- */
function route(){const v=location.hash==='#farmatsevty'?'farmatsevty':'likari';
  for(const k of ['likari','farmatsevty']){document.getElementById('v-'+k).hidden=k!==v;
    const t=document.getElementById('tab-'+k); if(k===v)t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current')}}
window.addEventListener('hashchange',route);
drawChips();drawYears();fillPhMonths();renderDr();renderPh();route();
</script>
